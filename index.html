<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARA SAJU | 타라사주 통합 랜딩페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sand: '#DBCDB4',
                        moss: '#4A5844',
                        'soft-white': '#F9F7F2',
                        'deep-moss': '#2D3629'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif KR"', 'serif'],
                        sans: ['Pretendard', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            scroll-behavior: smooth;
            background-color: #F9F7F2;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Noto Serif KR', serif;
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(219, 205, 180, 0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(219, 205, 180, 0.3);
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-scroll {
            animation: scroll 40s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none opacity-20 z-0">
        <div class="flex animate-scroll whitespace-nowrap">
            <span class="text-[15rem] font-serif font-black text-sand px-10">TARA SAJU</span>
            <span class="text-[15rem] font-serif font-black text-sand px-10">TARA SAJU</span>
        </div>
    </div>

    <div id="root" class="relative z-10 w-full max-w-lg px-6">
        <div class="glass-card rounded-[2.5rem] p-12 shadow-2xl text-center border border-sand/20">
            <h1 class="text-6xl font-black text-moss mb-4 tracking-tighter text-glow">TARA</h1>
            <h2 class="text-2xl font-serif text-sand tracking-[0.3em] mb-12">SAJU</h2>
            
            <div class="space-y-4">
                <input type="text" placeholder="이름을 입력하세요" 
                    class="w-full bg-soft-white/50 border-b-2 border-sand p-4 focus:outline-none focus:border-moss transition-colors font-sans text-lg text-deep-moss">
                
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" 
                        class="w-full bg-soft-white/50 border-b-2 border-sand p-4 focus:outline-none focus:border-moss transition-colors font-sans text-deep-moss">
                    <select class="w-full bg-soft-white/50 border-b-2 border-sand p-4 focus:outline-none focus:border-moss transition-colors font-sans text-deep-moss">
                        <option>태어난 시간 알 수 없음</option>
                        <option>자시 (23:30~01:29)</option>
                        <option>축시 (01:30~03:29)</option>
                        </select>
                </div>

                <button class="w-full mt-8 py-5 bg-moss text-soft-white rounded-2xl font-serif text-xl font-bold hover:bg-deep-moss transition-all transform hover:scale-[1.01] shadow-xl">
                    운명의 흐름 확인하기
                </button>
            </div>

            <p class="mt-12 text-[10px] text-sand tracking-[0.2em] uppercase">Premium Fortune Consulting</p>
        </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom": "https://esm.sh/react-dom@^19.2.4",
        "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
      }
    }
    </script>
</body>
</html>
