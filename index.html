<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARA SAJU | 타라사주 통합 랜딩페이지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { sand: '#DBCDB4', moss: '#4A5844', 'soft-white': '#F9F7F2', 'deep-moss': '#2D3629' },
                    fontFamily: { serif: ['"Noto Serif KR"', 'serif'], sans: ['Pretendard', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Pretendard', sans-serif; scroll-behavior: smooth; background-color: #F9F7F2; }
        h1, h2, h3, .font-serif { font-family: 'Noto Serif KR', serif; }
        .animate-scroll { animation: scroll 40s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 1s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 데이터 정의 (사용자님 코드 기반) ---
        const FEATURES = [
            { id: 1, icon: "💎", title: "본연의 기질", description: "태어날 때 부여받은 당신만의 고유한 에너지와 그릇을 분석합니다." },
            { id: 2, icon: "🌊", title: "대운의 흐름", description: "지금이 썰물인지 밀물인지, 인생의 큰 주기를 짚어드립니다." },
            { id: 3, icon: "⚖️", title: "오행의 균형", description: "과하거나 부족한 기운을 찾아 삶의 균형을 잡는 법을 제안합니다." },
            { id: 4, icon: "💼", title: "사회적 성취", description: "직업적 재능과 재물이 모이는 구체적인 방향을 분석합니다." },
            { id: 5, icon: "🤝", title: "관계의 결", description: "주변 사람들과의 조화, 그리고 내게 맞는 인연의 특징을 읽습니다." },
            { id: 6, icon: "🎯", title: "결정적 시기", description: "중요한 선택을 내리기에 가장 유리한 타이밍을 제안합니다." }
        ];

        const TESTIMONIALS = [
            { content: "막연했던 불안감이 사라지고 지금 무엇을 해야 할지 명확해졌어요.", author: "김OO 님" },
            { content: "사업 확장을 고민하던 시기에 정말 큰 도움이 되었습니다.", author: "이OO 님" },
            { content: "연애운 분석을 통해 저 자신을 더 깊이 이해하게 되었네요.", author: "박OO 님" }
        ];

        // --- 컴포넌트 이식 ---
        const Header = () => (
            <header className="fixed top-0 left-0 right-0 z-50 bg-soft-white/80 backdrop-blur-md border-b border-sand/30">
                <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                    <div className="text-moss font-serif text-2xl font-black tracking-widest">TARA SAJU</div>
                    <nav className="hidden md:flex gap-8 text-sm font-medium text-moss/70">
                        <a href="#features" className="hover:text-moss">핵심 분석</a>
                        <a href="#social" className="hover:text-moss">후기</a>
                        <a href="#apply" className="px-4 py-2 bg-moss text-white rounded-full">리포트 신청</a>
                    </nav>
                </div>
            </header>
        );

        const Hero = ({ onSetIntent }) => (
            <section className="relative h-screen flex items-center justify-center overflow-hidden">
                <div className="absolute inset-0 z-0">
                    <img src="https://images.unsplash.com/photo-1544207592-72eeFA17aa35?q=80&w=2072&auto=format&fit=crop" className="w-full h-full object-cover brightness-110" />
                    <div className="absolute inset-0 bg-white/40 backdrop-blur-[2px]"></div>
                </div>
                <div className="relative z-10 max-w-4xl px-6 text-center animate-fade-in">
                    <h1 className="text-4xl md:text-6xl font-serif font-bold mb-6 text-moss leading-tight">
                        요즘, 왜 이렇게 막막한지.<br /><span className="text-sand drop-shadow-sm">사주 흐름</span>으로 정확히 정리해드립니다.
                    </h1>
                    <p className="text-lg md:text-xl font-medium mb-10 text-moss/80 max-w-2xl mx-auto leading-relaxed">
                        타라사주는 달콤한 말로 끝내지 않습니다. 당신의 사주 구조로부터 지금 막히는 이유와 열리는 타이밍을 알려드립니다.
                    </p>
                    <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                        <a href="#apply" className="px-8 py-4 bg-moss text-white font-bold rounded-full shadow-lg hover:scale-105 transition-all">내 사주 리포트 신청하기</a>
                    </div>
                </div>
            </section>
        );

        const ProblemSolution = () => (
            <section className="py-24 px-6 bg-soft-white">
                <div className="max-w-5xl mx-auto grid md:grid-cols-2 gap-16 items-center">
                    <div className="bg-white border-2 border-sand rounded-3xl p-10 shadow-xl">
                        <div className="inline-block px-3 py-1 bg-sand/20 text-moss text-[10px] font-black tracking-widest rounded-full mb-6">SOLUTION</div>
                        <h3 className="text-2xl font-serif mb-6 text-moss font-black">정확한 사주 구조 분석</h3>
                        <p className="text-moss/80 leading-relaxed mb-6">당신의 사주 구조로 무엇이 막는지, 무엇이 열리는지를 분명히 말합니다. 타라사주는 추상적인 위로 대신, 명확한 데이터를 제공합니다.</p>
                    </div>
                    <div className="text-center font-serif text-3xl text-moss italic">"결정이 쉬워지는 <br/> 데이터 기반 명리학"</div>
                </div>
            </section>
        );

        const SegmentationBridge = ({ selectedIntent, onSetIntent }) => (
            <section id="bridge" className="py-24 px-6 bg-[#F2EDE4]">
                <div className="max-w-7xl mx-auto">
                    <h2 className="text-3xl md:text-5xl font-serif mb-16 text-center text-moss">지금 가장 시급한 고민은?</h2>
                    <div className="grid md:grid-cols-2 gap-8">
                        <div onClick={() => onSetIntent('life')} className={`p-10 rounded-3xl border-2 cursor-pointer transition-all ${selectedIntent === 'life' ? 'bg-moss text-white border-moss' : 'bg-white border-sand'}`}>
                            <span className="text-sm font-bold opacity-60 uppercase">Type A. 인생 고민형</span>
                            <h3 className="text-2xl font-serif mt-4 mb-6">“지금은 밀어붙일 때인지, 정비할 때인지부터.”</h3>
                            <button className="mt-4 px-6 py-2 rounded-full border border-current">내 흐름 정리하기</button>
                        </div>
                        <div onClick={() => onSetIntent('romance')} className={`p-10 rounded-3xl border-2 cursor-pointer transition-all ${selectedIntent === 'romance' ? 'bg-sand text-deep-moss border-sand' : 'bg-white border-sand'}`}>
                            <span className="text-sm font-bold opacity-60 uppercase">Type B. 연애·결혼형</span>
                            <h3 className="text-2xl font-serif mt-4 mb-6">“그 사람, 그리고 그 시기. 흔들리지 않게.”</h3>
                            <button className="mt-4 px-6 py-2 rounded-full border border-current">연애 흐름 확인하기</button>
                        </div>
                    </div>
                </div>
            </section>
        );

        const App = () => {
            const [intent, setIntent] = useState('life');
            return (
                <div className="min-h-screen">
                    <Header />
                    <Hero onSetIntent={setIntent} />
                    <ProblemSolution />
                    <SegmentationBridge selectedIntent={intent} onSetIntent={setIntent} />
                    <section id="features" className="py-24 px-6 bg-white">
                        <div className="max-w-7xl mx-auto grid md:grid-cols-3 gap-8">
                            {FEATURES.map(f => (
                                <div key={f.id} className="p-8 bg-soft-white rounded-2xl border border-sand/20">
                                    <div className="text-3xl mb-4">{f.icon}</div>
                                    <h3 className="text-xl font-bold font-serif mb-2 text-moss">{f.title}</h3>
                                    <p className="text-sm text-moss/70">{f.description}</p>
                                </div>
                            ))}
                        </div>
                    </section>
                    <section id="social" className="py-24 bg-moss overflow-hidden">
                        <div className="flex animate-scroll">
                            {[...TESTIMONIALS, ...TESTIMONIALS].map((t, i) => (
                                <div key={i} className="min-w-[300px] mx-4 p-8 bg-deep-moss text-sand rounded-2xl border border-sand/10">
                                    <p className="italic text-sm">"{t.content}"</p>
                                    <div className="mt-4 text-xs opacity-50">— {t.author}</div>
                                </div>
                            ))}
                        </div>
                    </section>
                    <footer className="py-20 bg-deep-moss text-sand/50 text-center text-[10px] tracking-widest uppercase">
                        &copy; 2026 TARA SAJU / NOMARIT. ALL RIGHTS RESERVED.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
