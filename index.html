<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARA SAJU | 타라사주 리포트</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { sand: '#DBCDB4', moss: '#4A5844', 'soft-white': '#F9F7F2', 'deep-moss': '#2D3629' },
                    fontFamily: { serif: ['"Noto Serif KR"', 'serif'], sans: ['Pretendard', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Pretendard', sans-serif; scroll-behavior: smooth; background-color: #F9F7F2; }
        .animate-scroll { display: flex; width: max-content; animation: scroll 40s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-fade-in { animation: fadeIn 1s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .selection\:bg-sand ::selection { background-color: #DBCDB4; color: #2D3629; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- 데이터 정의 ---
        const FEATURES = [
              { id: 1, title: "나 이해(성격・심리)", description: "흔들리는 이유를 구조로 정리해 결정 피로를 줄입니다.", icon: "🧘" },
  { id: 2, title: "관계(연애・배우자)", description: "맞는 사람의 결·타이밍을 확인해 같은 실수를 반복하지 않게 합니다.", icon: "💑" },
  { id: 3, title: "커리어(직업운)", description: "버틸지 옮길지, 성과 나는 순서를 먼저 정리합니다.", icon: "💼" },
  { id: 4, title: "자산(재물운)", description: "돈이 붙는/새는 구간을 구분해 흐름을 안정화합니다.", icon: "💰" },
  { id: 5, title: "컨디션(건강운)", description: "무너지는 포인트를 미리 알고 관리 루틴을 잡습니다.", icon: "🌱" },
  { id: 6, title: "큰 흐름(대운(大運))", description: "변곡점을 읽어 기회는 선점, 위기는 회피하게 돕습니다.", icon: "⏳" }
        ];

        const TESTIMONIALS = [
              { id: 1, content: "이직 문제로 고민이 많았는데 리포트의 직업운 분석 덕분에 용기를 얻었습니다. 정확한 시기에 맞춰 옮겼더니 연봉도 올랐네요!", author: "30대 직장인 이OO님" },
  { id: 2, content: "인테리어만큼이나 세련된 분석 내용에 놀랐습니다. 제 성격을 정확히 꿰뚫어 보는데, 단순한 운세를 넘어 심리학 서적을 읽는 기분이었어요.", author: "20대 프리랜서 김OO님" },
  { id: 3, content: "연애운 리포트를 보고 제 연애 스타일의 문제점을 발견했습니다. 덕분에 지금은 저와 꼭 맞는 좋은 분을 만나 행복합니다.", author: "30대 전문직 박OO님" },
  { id: 4, content: "건강운에서 주의하라는 부분을 검진했더니 조기에 발견해 치료할 수 있었습니다. 타라사주가 제 생명의 은인이나 다름없어요.", author: "40대 주부 최OO님" },
  { id: 5, content: "사업 확장 시기를 고민하던 중 대운 흐름을 확인하고 결정했습니다. 확실히 운의 흐름을 알고 나아가니 성과가 다릅니다.", author: "40대 대표 정OO님" },
  { id: 6, content: "막막했던 취업 준비 기간에 제 사주 리포트가 큰 위로와 확신이 되었습니다. 할 수 있다는 자신감을 얻어 결국 합격했습니다.", author: "20대 취준생 강OO님" },
  { id: 7, content: "재물운 리포트는 제 재테크의 바이블입니다. 언제 투자하고 언제 조심해야 하는지 명확히 알려주니 마음이 든든하네요.", author: "30대 투자자 윤OO님" },
  { id: 8, content: "부부 사이가 소원했는데 서로의 기질 리포트를 보고 이해의 폭이 넓어졌습니다. 덕분에 집안 분위기가 다시 화목해졌습니다.", author: "40대 직장인 한OO님" },
  { id: 9, content: "친구에게 선물로 줬는데 너무 좋아하더라고요. 디자인도 예쁘고 내용도 풍성해서 가치 있는 선물을 한 것 같아 뿌듯합니다.", author: "20대 대학생 신OO님" },
  { id: 10, content: "복잡한 고민이 있을 때마다 타라사주를 찾게 됩니다. 항상 긍정적이고 확신 있는 조언을 해주셔서 삶의 에너지를 얻습니다.", author: "30대 디자이너 송OO님" }
        ];

        // --- 컴포넌트 구현 (사용자 제공 코드와 1:1 매칭) ---

        const Header = () => (
            <header className="fixed top-0 left-0 right-0 z-50 bg-soft-white/80 backdrop-blur-md border-b border-sand/30">
                <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                    <div className="text-moss font-serif text-2xl font-black tracking-widest">TARA SAJU</div>
                    <nav className="hidden md:flex gap-8 text-sm font-medium text-moss/70">
                        <a href="#features" className="hover:text-moss transition-colors">핵심 분석</a>
                        <a href="#social" className="hover:text-moss transition-colors">후기</a>
                        <a href="#apply" className="px-4 py-2 bg-moss text-white rounded-full hover:bg-deep-moss transition-colors">리포트 신청</a>
                    </nav>
                </div>
            </header>
        );

        const Hero = ({ onSetIntent }) => (
            <section className="relative h-screen flex items-center justify-center overflow-hidden">
                <div className="absolute inset-0 z-0">
                    <img src="https://images.unsplash.com/photo-1544207592-72eeFA17aa35?q=80&w=2072&auto=format&fit=crop" className="w-full h-full object-cover brightness-110 scale-105" />
                    <div className="absolute inset-0 bg-white/40 backdrop-blur-[2px]"></div>
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-white/20 to-soft-white"></div>
                </div>
                <div className="relative z-10 max-w-4xl px-6 text-center">
                    <h1 className="text-4xl md:text-6xl font-serif font-bold mb-6 leading-tight animate-fade-in text-moss">
                        요즘, 왜 이렇게 막막한지.<br /><span className="text-sand drop-shadow-sm">사주 흐름</span>으로 정확히 정리해드립니다.
                    </h1>
                    <p className="text-lg md:text-xl font-medium mb-10 text-moss/80 max-w-2xl mx-auto leading-relaxed">
                        타라사주는 달콤한 말로 끝내지 않습니다. 당신의 사주 구조로부터 지금 막히는 이유와 열리는 타이밍을 알려드립니다.
                    </p>
                    <div className="flex flex-col sm:flex-row gap-4 justify-center items-center mb-12">
                        <a href="#apply" className="w-full sm:w-auto px-8 py-4 bg-moss text-white font-bold rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all">내 사주 리포트 신청하기</a>
                    </div>
                    <div className="flex flex-wrap justify-center gap-6 pt-8 border-t border-moss/10">
                        <button onClick={() => { onSetIntent('life'); window.location.href = '#apply'; }} className="flex items-center gap-2 text-moss/70 hover:text-moss transition-colors group font-semibold">
                            <span className="w-8 h-8 rounded-full border border-moss/30 flex items-center justify-center group-hover:border-moss group-hover:bg-moss/5 transition-all text-xs">↓</span>
                            일·돈·미래가 답답해요
                        </button>
                        <button onClick={() => { onSetIntent('romance'); window.location.href = '#apply'; }} className="flex items-center gap-2 text-moss/70 hover:text-moss transition-colors group font-semibold">
                            <span className="w-8 h-8 rounded-full border border-moss/30 flex items-center justify-center group-hover:border-moss group-hover:bg-moss/5 transition-all text-xs">↓</span>
                            연애·결혼이 궁금해요
                        </button>
                    </div>
                </div>
            </section>
        );

        const ProblemSolution = () => (
            <section className="py-24 px-6 bg-soft-white overflow-hidden">
                <div className="max-w-5xl mx-auto grid md:grid-cols-2 gap-16 items-stretch">
                    <div className="flex items-center justify-center p-8 rounded-2xl bg-soft-white border border-sand/20">
                        <img src="https://images.unsplash.com/photo-1621252179027-94459d278660?q=80&w=1000&auto=format&fit=crop" className="w-full max-w-xs rounded-full drop-shadow-xl animate-fade-in" />
                    </div>
                    <div className="relative flex flex-col justify-center">
                        <div className="bg-white border-2 border-sand rounded-3xl p-10 md:p-12 shadow-xl h-full flex flex-col justify-center">
                           <div className="inline-block px-3 py-1 bg-sand/20 text-moss text-[10px] font-black tracking-widest rounded-full mb-6 w-fit">SOLUTION</div>
                           <h3 className="text-2xl font-serif mb-6 text-moss font-black">정확한 사주 구조 분석</h3>
                           <div className="space-y-6 text-moss/80 font-medium leading-relaxed">
                             <p>당신의 사주 구조로 무엇이 막는지, 무엇이 열리는지를 분명히 말합니다. 그래서 결정이 쉬워집니다.</p>
                             <p className="pt-6 border-t border-sand/30">타라사주는 추상적인 위로 대신,<br /><span className="text-moss font-black underline decoration-sand decoration-4 underline-offset-4">명확한 데이터를 제공합니다.</span></p>
                           </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const SegmentationBridge = ({ selectedIntent, onSetIntent }) => (
            <section id="bridge" className="py-24 px-6 bg-[#F2EDE4]">
                <div className="max-w-7xl mx-auto">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl md:text-5xl font-serif mb-4 text-moss">지금 가장 시급한 고민은 무엇인가요?</h2>
                        <p className="text-moss/60">목적에 최적화된 리포트를 구성해드립니다.</p>
                    </div>
                    <div className="grid md:grid-cols-2 gap-8">
                        {/* TYPE A */}
                        <div onClick={() => onSetIntent('life')} className={`cursor-pointer group p-10 rounded-3xl border-2 transition-all h-full flex flex-col justify-between ${selectedIntent === 'life' ? 'bg-moss text-white border-moss shadow-2xl' : 'bg-white text-moss border-sand hover:border-moss'}`}>
                            <div>
                                <span className="text-sm font-bold tracking-widest opacity-60">TYPE A. 인생 고민형</span>
                                <h3 className="text-2xl md:text-3xl font-serif mt-4 mb-8">“지금은 밀어붙일 때인지,<br />정비할 때인지부터.”</h3>
                                <ul className="space-y-4 text-lg text-left">
                                    <li>● 힘이 붙는 시기 vs 소모가 큰 시기</li>
                                    <li>● 커리어 방향 우선순위 제안</li>
                                    <li>● 돈 흐름 관리 포인트</li>
                                </ul>
                            </div>
                            <div className={`mt-10 px-6 py-3 rounded-full text-center font-bold border ${selectedIntent === 'life' ? 'bg-white text-moss border-white' : 'bg-moss text-white border-moss'}`}>내 흐름 먼저 정리하기</div>
                        </div>
                        {/* TYPE B */}
                        <div onClick={() => onSetIntent('romance')} className={`cursor-pointer group p-10 rounded-3xl border-2 transition-all h-full flex flex-col justify-between ${selectedIntent === 'romance' ? 'bg-sand text-deep-moss border-sand shadow-2xl' : 'bg-white text-moss border-sand hover:border-sand/60'}`}>
                            <div>
                                <span className="text-sm font-bold tracking-widest opacity-60">TYPE B. 연애·결혼형</span>
                                <h3 className="text-2xl md:text-3xl font-serif mt-4 mb-8">“그 사람, 그리고 그 시기.<br />흔들리지 않게.”</h3>
                                <ul className="space-y-4 text-lg text-left">
                                    <li>● 내게 맞는 관계의 결</li>
                                    <li>● 인연의 타이밍(시작/정리)</li>
                                    <li>● 결혼·가정운 선택 기준</li>
                                </ul>
                            </div>
                            <div className={`mt-10 px-6 py-3 rounded-full text-center font-bold border ${selectedIntent === 'romance' ? 'bg-deep-moss text-white border-deep-moss' : 'bg-sand text-deep-moss border-sand'}`}>연애·결혼 흐름 확인하기</div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const ApplicationForm = ({ intent, onIntentChange }) => {
            const [formData, setFormData] = useState({ name: '', gender: 'female', birthDate: '', birthTime: 'unknown', calendarType: 'solar', intent: intent || 'life' });
            const [isLoading, setIsLoading] = useState(false);
            const [preview, setPreview] = useState(null);

            useEffect(() => { if (intent) setFormData(prev => ({ ...prev, intent })); }, [intent]);

            const handleSubmit = (e) => {
                e.preventDefault();
                setIsLoading(true);
                setTimeout(() => {
                    setPreview(`${formData.name}님은 현재 ${formData.intent === 'life' ? '새로운 시작의 기운이 꿈틀거리는' : '인연의 결이 깊어지는'} 흐름 속에 계십니다. 구체적인 대운의 변화는 리포트에서 확인하실 수 있습니다.`);
                    setIsLoading(false);
                }, 1500);
            };

            return (
                <section id="apply" className="py-24 px-6 bg-soft-white">
                    <div className="max-w-3xl mx-auto">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-serif text-moss mb-4">리포트 신청 (입력 1분)</h2>
                        </div>
                        <form onSubmit={handleSubmit} className="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-sand/30 space-y-8">
                            <div className="flex gap-4">
                                <button type="button" onClick={() => onIntentChange('life')} className={`flex-1 p-4 rounded-xl border-2 transition-all ${formData.intent === 'life' ? 'bg-moss text-white border-moss' : 'bg-white border-sand'}`}>종합 사주</button>
                                <button type="button" onClick={() => onIntentChange('romance')} className={`flex-1 p-4 rounded-xl border-2 transition-all ${formData.intent === 'romance' ? 'bg-sand text-deep-moss border-sand' : 'bg-white border-sand'}`}>연애 특화</button>
                            </div>
                            <div className="grid md:grid-cols-2 gap-6">
                                <input required type="text" placeholder="성함" className="p-3 border rounded-xl" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                <select className="p-3 border rounded-xl" value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})}>
                                    <option value="female">여성</option><option value="male">남성</option>
                                </select>
                            </div>
                            <div className="grid md:grid-cols-2 gap-6">
                                <input required type="date" className="p-3 border rounded-xl" value={formData.birthDate} onChange={e => setFormData({...formData, birthDate: e.target.value})} />
                                <select className="p-3 border rounded-xl" value={formData.birthTime} onChange={e => setFormData({...formData, birthTime: e.target.value})}>
                                    <option value="unknown">모름 (자시 전후 00시 기준)</option>
                <option value="00:00">자시 (00:00 ~ 01:30)</option>
                <option value="02:00">축시 (01:30 ~ 03:30)</option>
                <option value="04:00">인시 (03:30 ~ 05:30)</option>
                <option value="06:00">묘시 (05:30 ~ 07:30)</option>
                <option value="08:00">진시 (07:30 ~ 09:30)</option>
                <option value="10:00">사시 (09:30 ~ 11:30)</option>
                <option value="12:00">오시 (11:30 ~ 13:30)</option>
                <option value="14:00">미시 (13:30 ~ 15:30)</option>
                <option value="16:00">신시 (15:30 ~ 17:30)</option>
                <option value="18:00">유시 (17:30 ~ 19:30)</option>
                <option value="20:00">술시 (19:30 ~ 21:30)</option>
                <option value="22:00">해시 (21:30 ~ 23:30)</option>
                                </select>
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full py-5 bg-moss text-white rounded-full font-black text-lg">
                                {isLoading ? '분석 중...' : '리포트 신청하기'}
                            </button>
                        </form>
                        {preview && (
                            <div className="mt-12 p-10 bg-white border-2 border-sand rounded-3xl animate-fade-in">
                                <h3 className="text-xl font-serif text-moss text-center mb-4">분석 미리보기</h3>
                                <p className="text-center italic text-moss/80">{preview}</p>
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="bg-soft-white py-16 px-6 border-t border-sand/20 text-moss/70">
                <div className="max-w-7xl mx-auto grid md:grid-cols-3 gap-12 text-sm">
                    <div>
                        <div className="text-moss font-serif text-2xl font-black mb-4">TARA SAJU</div>
                        <p className="font-bold">노마릿 | 대표: 고수빈</p>
                        <p>경기도 용인시 처인구 포곡읍 포곡로 72, 2층</p>
                    </div>
                    <div>
                        <h4 className="font-bold text-moss mb-4">CS & CONTACT</h4>
                        <p>CS: 010-4648-0046</p>
                        <p>Email: binzzz010101@gmail.com</p>
                    </div>
                    <div className="opacity-80 border-l border-sand pl-4 italic">
                        "삶의 중요한 변곡점에서 최고의 결정을 돕는 리포트를 제공합니다."
                    </div>
                </div>
                <div className="text-center mt-12 text-[10px] opacity-40">&copy; {new Date().getFullYear()} NOMARIT. ALL RIGHTS RESERVED.</div>
            </footer>
        );

        const App = () => {
            const [intent, setIntent] = useState('life');
            return (
                <div className="min-h-screen selection:bg-sand selection:text-deep-moss">
                    <Header />
                    <Hero onSetIntent={setIntent} />
                    <ProblemSolution />
                    <SegmentationBridge selectedIntent={intent} onSetIntent={setIntent} />
                    <section id="features" className="py-24 px-6 bg-white">
                        <div className="max-w-7xl mx-auto grid md:grid-cols-3 gap-8">
                            {FEATURES.map(f => (
                                <div key={f.id} className="p-10 rounded-2xl bg-soft-white border border-sand/20">
                                    <div className="text-4xl mb-6">{f.icon}</div>
                                    <h3 className="text-xl font-bold font-serif mb-4 text-moss">{f.title}</h3>
                                    <p className="text-sm text-moss/70 leading-relaxed">{f.description}</p>
                                </div>
                            ))}
                        </div>
                    </section>
                    <section id="social" className="py-24 bg-moss overflow-hidden">
                        <div className="animate-scroll">
                            {[...TESTIMONIALS, ...TESTIMONIALS].map((t, i) => (
                                <div key={i} className="min-w-[350px] mx-4 p-8 bg-deep-moss text-sand rounded-2xl border border-sand/20">
                                    <p className="italic mb-4">"{t.content}"</p>
                                    <div className="text-xs opacity-70">— {t.author}</div>
                                </div>
                            ))}
                        </div>
                    </section>
                    <ApplicationForm intent={intent} onIntentChange={setIntent} />
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
